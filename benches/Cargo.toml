[package]
name = "redust-benches"
version = "0.0.0"
edition = "2021"
publish = false
description = "Benchmarks comparing redust with other Redis libraries."

[dependencies]
bytes = "1.12"
criterion = { version = "0.8.2", features = ["async_tokio"] }
fred = { version = "10.1", default-features = false, features = ["i-keys", "i-server"] }
redis = { version = "1.8", default-features = false, features = ["tokio-comp"] }
redis-protocol = { version = "6", features = ["resp2"] }
redust = { path = ".." }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7.20", features = ["codec"] }

[[bench]]
name = "client"
harness = false

[[bench]]
name = "resp"
harness = false
