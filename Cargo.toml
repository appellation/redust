[package]
name = "redust"
version = "0.4.0"
edition = "2021"
repository = "https://github.com/appellation/redust"
license = "MIT"
description = "A simple Redis client for Rust."
keywords = ["redis"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["resp", "benches"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
bytes = "1.12"
deadpool = { version = "0.13", optional = true }
futures = "0.3.34"
pin-project-lite = "0.2.17"
redust-resp = { path = "./resp", version = "0.2", features = ["codec"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.19", optional = true }
tokio = { version = "1.54", features = ["net"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"

[dev-dependencies]
lazy_static = "1.5"
test-log = { version = "0.2.21", default-features = false, features = ["trace"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4.6"

[dev-dependencies.tracing-subscriber]
version = "0.3.23"
default-features = false
features = ["env-filter", "fmt"]

[features]
command = ["async-trait", "model"]
pool = ["deadpool"]
model = ["serde", "serde_bytes"]
script = ["serde_bytes"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "pool"
path = "tests/pool.rs"
required-features = ["pool"]

[[test]]
name = "script"
path = "tests/script.rs"
required-features = ["script"]
